# Netlify Configuration for Scoutisme Hassania Safi
# This file configures the build, deployment, and redirect rules for Netlify

[build]
  # Build command - compiles both client and server
  command = "pnpm build"
  
  # Directory containing the built application
  publish = "dist/spa"
  
  # Node version for the build
  node_version = "20.x"

# Environment variables
[build.environment]
  # These can be overridden in Netlify UI
  NODE_ENV = "production"

# Rewrite rules for single-page app (SPA)
# This ensures React Router works correctly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache control for static assets
[[headers]]
  for = "/*.{js,css,svg,woff2,png,jpg,jpeg,gif}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache control for index.html (should not be cached)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# API redirects (if needed in future)
# [[redirects]]
#   from = "/api/*"
#   to = "/.netlify/functions/:splat"
#   status = 200

# Success message
[build.processing]
  text-compression = true
